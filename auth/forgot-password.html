<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Forgot Password | Notes</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body class="forgot">
    <div class="forgot__container">
      <div class="forgot__card">
        <div class="forgot__header">
          <img
            src="../assets/images/logo.svg"
            alt="Notes Logo"
            class="forgot__logo"
          />

          <h1 class="forgot__title">Forgotten your password?</h1>
          <p class="forgot__subtitle">
            Enter your email below, and we’ll send you a link to reset it.
          </p>
        </div>

        <form class="forgot__form" id="forgotForm">
          <div class="forgot__field">
            <label class="forgot__label">Email Address</label>
            <input
              type="email"
              class="forgot__input"
              placeholder="email@example.com"
              required
            />
          </div>

          <button type="submit" class="forgot__button forgot__button--primary">
            Send Reset Link
          </button>
        </form>
      </div>
    </div>

    <script src="scripts/main.js"></script>
  </body>
</html>
