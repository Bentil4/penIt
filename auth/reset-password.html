<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Reset Password | Notes</title>
    <link rel="stylesheet" href="../css/main.css" />
  </head>
  <body class="reset">
    <main class="reset__container">
      <section class="reset__card" aria-labelledby="reset-title">
        <header class="reset__header">
          <img
            src="../assets/images/logo.svg"
            alt="Notes logo"
            class="reset__logo"
          />
          <h1 id="reset-title" class="reset__title">Reset Your Password</h1>
          <p class="reset__subtitle">
            Choose a new password to secure your account.
          </p>
        </header>

        <form class="reset__form" id="resetForm" novalidate>
          <div class="reset__field">
            <label for="password" class="reset__label">New Password</label>

            <div class="reset__input-wrapper">
              <input
                type="password"
                id="password"
                class="reset__input"
                required
                minlength="8"
              />
              <button
                type="button"
                class="reset__toggle"
                aria-label="Toggle password visibility"
              >
                <img
                  src="../assets/images/icon-show-password.svg"
                  alt="Toggle Password Visibility"
                />
              </button>
            </div>

            <p class="reset__hint">
              <img src="../assets/images/icon-info.svg" /> At least 8 characters
            </p>
          </div>

          <div class="reset__field">
            <label for="confirmPassword" class="reset__label">
              Confirm New Password
            </label>

            <div class="reset__input-wrapper">
              <input
                type="password"
                id="confirmPassword"
                class="reset__input"
                required
              />
              <button
                type="button"
                class="reset__toggle"
                aria-label="Toggle password visibility"
              >
                <img
                  src="../assets/images/icon-show-password.svg"
                  alt="Toggle Password Visibility"
                />
              </button>
            </div>
          </div>

          <button type="submit" class="reset__button reset__button--primary">
            Reset Password
          </button>
        </form>
      </section>
    </main>

    <script src="scripts/main.js"></script>
  </body>
</html>
