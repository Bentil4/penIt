<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
      <link rel="stylesheet" href="./css/style.css">

    <link
      rel="icon"
      type="image/png"
      sizes="32x32"
      href="./assets/images/favicon-32x32.png"
    />

    <title> Bentil | Note-taking web app</title>
  </head>
  <body>

<!--  Side-Bar-->
    <section class="container">
      <aside class="sidebar">
          <header class="logo">
              <img src="./assets/images/logo.svg" alt="Notes App Logo" />
          </header>
        <nav class="nav-section" aria-label="Navigation">
          <span class="home nav-item active" id="all-notes-btn">
            <img src="./assets/images/icon-home.svg" alt="" />
              <p>All Notes</p>
            <img class="rta-icon" src="./assets/images/icon-chevron-right.svg" alt="" />
          </span>
          <span class="nav-item" id="archived-notes-btn">
            <img src="./assets/images/icon-archive.svg" alt="" />
              <p>Archived Notes</p>
          </span>
        </nav>

        <section class="tags-section">
          <h3>Tags</h3>
          <ul id="tag-list" aria-label="Tag filters">
            <!-- Dynamic tags here, e.g., via template -->
          </ul>
        </section>


      </aside>


<!--        Content-->
        <span class="lines" ></span>
        <section class="inner-container">
<!--            Top-Bar-->
            <header class="note-header">
                <p class="note-title">Note</p>
                <span class="search-bar">
                    <label for="search"> <input type="text" name="" id="search"> </label>
                    <img src="./assets/images/icon-settings.svg" alt="">
                </span>
            </header>
            <span class="header-line" ></span>
            <section class="inner-container-wrapper">

<!--                left-->
                <section class="left-side" id="notes-section">dfds</section>
                <span class="lines" ></span>


<!--                Middle-->
                <section class="middle-side" id="write-note">dfd</section>
                <span class="lines" ></span>


<!--Right-->
                <section class="right-side">dfs</section>
            </section>
        </section>


    </section>

    All Notes Archived Notes Tags

    <!-- Page title -->

    Search by title, content, or tags Create New Note Tags Last Edited Archive
    Note Delete Note Save Note Cancel
  </body>
</html>
